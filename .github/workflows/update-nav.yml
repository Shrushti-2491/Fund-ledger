name: Update mutual fund NAVs

on:
  schedule:
    - cron: "0 15 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-nav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch latest NAVs
        run: python scripts/fetch_nav.py

      - name: Commit nav.json if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nav.json
          git diff --staged --quiet || git commit -m "Update NAVs $(date -u +%Y-%m-%d)"
          git push
